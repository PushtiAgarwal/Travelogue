
<html>
  <head>
    <title> </title>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      header{background-color:#DDA0DD;height:100px; text-align:center;padding:5px;}
      footer{background-color:#D3D3D3;height:80px;text-align:center;font-size:20px; padding:5px; position:absolute;top:620px;width:100%;}
      nav ul li{list-style-type:none;display:inline-block;}
      nav ul li a{text-decoration:none;margin:10px;font-size:24px;color:black;}
      .wrapper {position:absolute; top:150px;left:500px;width:400px;padding:25px;} 
      .wrapper h2{text-align:center; letter-spacing:3px;}
      .wrapper .inputfield{margin-bottom:10px;}
      .wrapper input{width:100%; padding:10px;}   
      .wrapper textarea{width:100%; padding:10px; height:80px;} 
      .wrapper .button input[type="submit"] {width:100%;background-color:lightblue;letter-spacing:5px; font-weight:bold;cursor:pointer;}
      #errormessage{background:red; text-align:center; font-size:15px;}
    </style>
    <script>
    function validate(){
     var name1=document.getElementById("name").value;
        var phone1=document.getElementById("phone").value;
        var email1=document.getElementById("email").value;
        var message1=document.getElementById("message").value;
      if(name1.length<5){
        text="Please enter full name";
        errormessage.innerHTML=text;
        return false;
      }
      if(isNaN(phone1)||phone1.length!=10){
            text="Please enter valid phone number";
        errormessage.innerHTML=text;
        return false;
      }
      if (email1.indexOf("@")==-1||email1.length<6){
            text="Please enter valid email";
        errormessage.innerHTML=text;
        return false;
      }
      if(message1.length<=10){    
        text="Please enter at least 10 characters";
        errormessage.innerHTML=text;
        return false;
      }
      alert("form submitted successfully");
      return true;
       }

      
    </script>
  </head>
   <body style="background-color:#E0FFFF;">
     
    <header>
      <h1>TOKYO</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="hotels.html">Hotels</a></li>
          <li><a href="food.html">Food</a></li>
          <li><a href="contactus.html">Contact us</a></li>
                 
        </ul>
      </nav>
      </header>
     <main> 
      <div class="wrapper">
      <h2> CONTACT US</h2>
        <form id="myform" onsubmit="return validate();">
       <div class="inputfield">
         <input type="text" placeholder="Name" id="name">
       </div>
          <div class="inputfield">
         <input type="text" placeholder="Phone" id="phone">
       </div>
         <div class="inputfield">
         <input type="text" placeholder="Email" id="email">
       </div>
          <div class="inputfield">
         <textarea placeholder="Message" id="message"></textarea>
       </div>
          <div class="button">
         <input type="Submit">
       </div>
          <div id="errormessage">
          </div>
         
        </form>         
      </div> 
     </main>
     <footer>
      <p>This website is made in collaboration with MindChamp.To know more about Tokyo <a href="https://en.wikipedia.org/wiki/Tokyo">click here</a></p> 
     </footer>
  </body>
  
</html>
